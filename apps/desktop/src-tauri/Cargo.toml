[package]
name = "now-doing"
version = "0.1.0"
description = "Lightweight presence reporter for your personal blog"
authors = ["Lu Jiejie"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
winreg = "0.55"
# `Win32_Security` is what gates `CreateMutexW` in windows-sys 0.60: the mutex
# takes a SECURITY_ATTRIBUTES pointer, so the signature lives behind that feature.
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
