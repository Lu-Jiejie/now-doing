[package]
name = "now-doing"
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
description = "Tray-only presence reporter for Windows"
license = "MIT"
authors = ["lujiejie"]

[lib]
name = "now_doing"
path = "src/lib.rs"

[[bin]]
name = "now-doing"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
winreg = "0.55"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tray-icon = { version = "0.21", default-features = false }
png = "0.18"
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Win32_System_Com",
] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
